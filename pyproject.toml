[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cordle"
version = "2.0.0"
description = "Wordle as a Discord bot"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bwandii" }]
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cordle = "cordle.__main__:main"

[tool.setuptools.packages.find]
include = ["cordle*"]

[tool.setuptools.package-data]
cordle = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
